services:
  - type: web
    name: jee-frontend
    env: node
    rootDir: client
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.17.0

  - type: web
    name: jee-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    branch: main
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.17.0
